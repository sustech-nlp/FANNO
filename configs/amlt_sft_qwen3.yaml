description: fanno-sft-qwen3-8b

target:
  service: sing
  name: msrresrchvc
  workspace_name: workspace_genai
  resource_group: gcr-singularity-resrch

environment:
  image: zhuhe/opd:latest
  registry: workspacegenaiacr.azurecr.io
  setup:
    - pip install trl wandb datasets
    - python3 -V
    - pip --version

code:
  local_dir: $CONFIG_DIR/..

storage:
  zhuhe:
    storage_account_name: msranlpinternhot
    container_name: hezhu
    mount_dir: /mnt/zhuhe

jobs:
  - name: fanno-sft-qwen3-8b
    sku: 40G8-A100-IB-NvLink
    process_count_per_node: 1
    mpi: true
    sla_tier: Premium
    priority: High
    command:
      - nvidia-smi -L
      - export BASE_DIR=/mnt/zhuhe
      - if [ -d /mnt/zhuhe/zhuhe ]; then export BASE_DIR=/mnt/zhuhe/zhuhe; fi
      - ls -ld "$$BASE_DIR"
      - export MODEL_PATH=$$BASE_DIR/models/Qwen3-8B
      - export TRAIN_DATA=$$BASE_DIR/data/fanno/fanno_train_100k.jsonl
      - export OUTPUT_DIR=$$BASE_DIR/saves/fanno/sft-qwen3-8b
      - export WANDB_PROJECT=fanno-sft
      - export WANDB_RUN_NAME=fanno-sft-qwen3-8b
      - ls -lh "$$MODEL_PATH"
      - ls -lh "$$TRAIN_DATA"
      - deepspeed --num_gpus=8 -m fanno.train.sft --model "$$MODEL_PATH" --data "$$TRAIN_DATA" --output-dir "$$OUTPUT_DIR" --epochs 3 --lr 2e-5 --per-device-batch 2 --gradient-accum 8 --max-length 2048 --deepspeed --wandb-project fanno-sft --wandb-run-name fanno-sft-qwen3-8b
